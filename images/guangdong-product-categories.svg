<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Guangdong product categories</title>
  <desc id="desc">An original information graphic summarizing Guangdong products across electronics, furniture, ceramics, lighting, garments, food, hardware and packaging.</desc>
